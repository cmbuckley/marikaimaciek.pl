name: Deploy Jekyll site to Pages
on:
  push:
    branches: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: cmbuckley/.github/.github/workflows/pages.yml@main
    secrets: inherit
    with:
      custom_commands: |
        echo "map_api_key: ${{ vars.MAP_API_KEY }}" >> _config.yml
